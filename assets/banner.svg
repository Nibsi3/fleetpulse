<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="road">
      <rect x="160" y="0" width="540" height="168"/>
    </clipPath>
    <style>
      .truck { animation: drive 9s linear infinite; }
      .spin  { animation: spin 0.9s linear infinite; transform-box: fill-box; transform-origin: center; }
      .p1    { animation: glow  2.4s ease-in-out 0s   infinite; }
      .p2    { animation: glow  2.4s ease-in-out 1.2s infinite; }
      .dl1   { animation: flowL 3.2s linear 0s   infinite; }
      .dl2   { animation: flowL 3.2s linear 1.1s infinite; }
      .dl3   { animation: flowL 3.2s linear 2.2s infinite; }
      .dr1   { animation: flowR 3.2s linear 0.5s infinite; }
      .dr2   { animation: flowR 3.2s linear 1.9s infinite; }
      @keyframes drive {
        0%   { transform: translate(38px, 62px); }
        100% { transform: translate(810px, 62px); }
      }
      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes glow {
        0%,100% { opacity:1; }
        50%     { opacity:0.3; }
      }
      @keyframes flowL {
        0%   { transform:translateX(0);    opacity:0; }
        10%  { opacity:1; }
        90%  { opacity:1; }
        100% { transform:translateX(52px); opacity:0; }
      }
      @keyframes flowR {
        0%   { transform:translateX(0);    opacity:0; }
        10%  { opacity:1; }
        90%  { opacity:1; }
        100% { transform:translateX(46px); opacity:0; }
      }
    </style>
  </defs>

  <!-- ══════════════════ BACKGROUND ══════════════════ -->
  <rect width="860" height="200" fill="#080e1a" rx="14"/>
  <!-- Divider lines between sections -->
  <line x1="160" y1="0"   x2="160" y2="168" stroke="#0e1e32" stroke-width="1"/>
  <line x1="700" y1="0"   x2="700" y2="168" stroke="#0e1e32" stroke-width="1"/>
  <line x1="0"   y1="168" x2="860" y2="168" stroke="#0e1e32" stroke-width="1"/>

  <!-- ══════════════════ LEFT STATION: SQLite + C# ══════════════════ -->
  <!-- Soft glow -->
  <ellipse cx="80" cy="138" rx="62" ry="18" fill="#16a34a" opacity="0.07"/>

  <!-- Database cylinder -->
  <ellipse cx="80" cy="110" rx="38" ry="13" fill="#14532d"/>
  <rect    x="42"  y="72"  width="76" height="38" fill="#15803d"/>
  <ellipse cx="80" cy="86"  rx="38" ry="13" fill="#16a34a"/>
  <ellipse cx="80" cy="72"  rx="38" ry="13" fill="#22c55e"/>
  <!-- Sheen on top -->
  <ellipse cx="72" cy="69"  rx="15" ry="5"  fill="#4ade80" opacity="0.45"/>

  <!-- Labels -->
  <text x="80" y="138" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="11" font-weight="bold" fill="#22c55e" letter-spacing="1">SQLite</text>
  <text x="80" y="152" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="9" fill="#15803d">EF Core · .NET 8</text>
  <!-- C# badge -->
  <rect x="38" y="156" width="84" height="15" fill="#052e16" rx="7.5"/>
  <text x="80" y="167" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="8.5" fill="#4ade80">C# Backend</text>

  <!-- ══════════════════ LEFT CONNECTOR ══════════════════ -->
  <line x1="120" y1="92" x2="163" y2="92" stroke="#1a2d4a" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="122" cy="92" r="3.5" fill="#22c55e" class="dl1"/>
  <circle cx="122" cy="92" r="3.5" fill="#22c55e" class="dl2"/>
  <circle cx="122" cy="92" r="3.5" fill="#22c55e" class="dl3"/>

  <!-- ══════════════════ ROAD (clipped center) ══════════════════ -->
  <g clip-path="url(#road)">
    <!-- Road surface -->
    <rect x="160" y="115" width="540" height="53" fill="#090f1d"/>
    <line x1="160" y1="113" x2="700" y2="113" stroke="#172540" stroke-width="2"/>
    <!-- Road dashes -->
    <rect x="174" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="216" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="258" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="300" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="342" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="384" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="426" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="468" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="510" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="552" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="594" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="636" y="134" width="22" height="3" fill="#122030" rx="1.5"/>
    <rect x="678" y="134" width="22" height="3" fill="#122030" rx="1.5"/>

    <!-- ══ CUTE TRUCK (rounded, no text above it) ══ -->
    <g class="truck">
      <circle cx="101.5" cy="-25" r="3.5" fill="#22d3ee" class="p1"/>
      <circle cx="101.5" cy="-25" r="0" fill="none" stroke="#22d3ee" stroke-width="1.5">
        <animate attributeName="r"       from="4" to="28" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.9" to="0"  dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="101.5" cy="-25" r="0" fill="none" stroke="#22d3ee" stroke-width="1">
        <animate attributeName="r"       from="4" to="28" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.65" to="0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>

      <!-- Trailer -->
      <rect x="0"  y="0" width="86" height="52" fill="#1e3a8a" rx="12"/>
      <rect x="0"  y="0" width="86" height="12" fill="#2563eb" rx="12"/>
      <rect x="0"  y="6" width="86" height="6"  fill="#2563eb"/>
      <circle cx="43" cy="44" r="3" fill="#3b82f6" class="p2"/>

      <!-- Hitch -->
      <rect x="86" y="16" width="8" height="20" fill="#172554" rx="3"/>

      <!-- Cab -->
      <rect x="92" y="8"  width="38" height="44" fill="#2563eb" rx="12"/>
      <rect x="100" y="13" width="22" height="21" fill="#bfdbfe" rx="6" opacity="0.7"/>
      <rect x="102" y="14" width="5"  height="10" fill="white"  rx="2.5" opacity="0.38"/>

      <!-- Headlight eye -->
      <circle cx="129" cy="38" r="7.5" fill="#fbbf24"/>
      <circle cx="130" cy="39" r="3"   fill="#78350f"/>
      <circle cx="127" cy="36" r="1.8" fill="#fef3c7" opacity="0.65"/>
      <ellipse cx="137" cy="38" rx="10" ry="5" fill="#fbbf24" opacity="0.13"/>

      <!-- Spinning wheels -->
      <g class="spin">
        <circle cx="114" cy="54" r="12" fill="#0a1120" stroke="#60a5fa" stroke-width="2.5"/>
        <circle cx="114" cy="54" r="5"  fill="#3b82f6"/>
        <line x1="114" y1="43" x2="114" y2="65" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
        <line x1="103" y1="54" x2="125" y2="54" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
      </g>

      <g class="spin">
        <circle cx="22"  cy="54" r="12" fill="#0a1120" stroke="#3b82f6" stroke-width="2.5"/>
        <circle cx="22"  cy="54" r="5"  fill="#1d4ed8"/>
        <line x1="22"  y1="43" x2="22"  y2="65" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
        <line x1="11"  y1="54" x2="33"  y2="54" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
      </g>

      <g class="spin">
        <circle cx="60"  cy="54" r="12" fill="#0a1120" stroke="#3b82f6" stroke-width="2.5"/>
        <circle cx="60"  cy="54" r="5"  fill="#1d4ed8"/>
        <line x1="60"  y1="43" x2="60"  y2="65" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
        <line x1="49"  y1="54" x2="71"  y2="54" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- ══════════════════ RIGHT CONNECTOR ══════════════════ -->
  <line x1="701" y1="92" x2="738" y2="92" stroke="#1a2d4a" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="703" cy="92" r="3.5" fill="#22d3ee" class="dr1"/>
  <circle cx="703" cy="92" r="3.5" fill="#22d3ee" class="dr2"/>

  <!-- ══════════════════ RIGHT STATION: React + TypeScript ══════════════════ -->
  <!-- Soft glow -->
  <ellipse cx="780" cy="138" rx="62" ry="18" fill="#0891b2" opacity="0.07"/>

  <!-- React atom — 3 orbits + nucleus -->
  <ellipse cx="780" cy="76" rx="40" ry="13" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.75"/>
  <ellipse cx="780" cy="76" rx="40" ry="13" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.85" transform="rotate(60,780,76)"/>
  <ellipse cx="780" cy="76" rx="40" ry="13" fill="none" stroke="#22d3ee" stroke-width="1.5"                  transform="rotate(120,780,76)"/>
  <circle cx="780" cy="76" r="7"   fill="#06b6d4"/>
  <circle cx="777" cy="73" r="2.5" fill="#a5f3fc" opacity="0.7"/>

  <!-- Labels -->
  <text x="780" y="131" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="11" font-weight="bold" fill="#06b6d4" letter-spacing="1">React</text>
  <text x="780" y="146" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="9" fill="#0891b2">TypeScript · Vite</text>
  <!-- Dashboard badge -->
  <rect x="737" y="150" width="86" height="15" fill="#0c2a40" rx="7.5"/>
  <text x="780" y="161" text-anchor="middle"
        font-family="'Courier New',Courier,monospace"
        font-size="8.5" fill="#7dd3fc">UI Dashboard</text>

  <!-- ══════════════════ BOTTOM TECH PILLS ══════════════════ -->
  <!-- centered: total pill width ≈ 440px, start x ≈ 210 -->
  <rect x="210" y="175" width="30"  height="15" fill="#2e1065" rx="7.5"/>
  <text x="225" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#c4b5fd">C#</text>

  <rect x="248" y="175" width="80"  height="15" fill="#2e1065" rx="7.5"/>
  <text x="288" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#c4b5fd">ASP.NET Core</text>

  <rect x="336" y="175" width="52"  height="15" fill="#14532d" rx="7.5"/>
  <text x="362" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#86efac">EF Core</text>

  <rect x="396" y="175" width="46"  height="15" fill="#14532d" rx="7.5"/>
  <text x="419" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#86efac">SQLite</text>

  <rect x="450" y="175" width="42"  height="15" fill="#0c2a40" rx="7.5"/>
  <text x="471" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#7dd3fc">React</text>

  <rect x="500" y="175" width="68"  height="15" fill="#0c2a40" rx="7.5"/>
  <text x="534" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#7dd3fc">TypeScript</text>

  <rect x="576" y="175" width="34"  height="15" fill="#1a0940" rx="7.5"/>
  <text x="593" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#a78bfa">Vite</text>

  <rect x="618" y="175" width="56"  height="15" fill="#0c2a2a" rx="7.5"/>
  <text x="646" y="186" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#5eead4">Tailwind</text>

  <!-- ══════════════════ BORDER ══════════════════ -->
  <rect width="860" height="200" fill="none" stroke="#0e1e32" stroke-width="1.5" rx="14"/>
</svg>
